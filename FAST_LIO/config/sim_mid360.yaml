common:
    lid_topic:  "/cloud_base"
    imu_topic:  "/trunk_imu"
    time_sync_en: false         # Simulation time is already synchronized
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 4                # 4 = MARSIM (standard PointCloud2 for simulation)
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360           # Mid-360 has 360° FOV
    det_range:     100.0
    extrinsic_est_en:  false
    extrinsic_T: [ 0.0, 0.0, 0.0 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  true
    scan_publish_en:  true
    dense_publish_en: false      # Save bandwidth in simulation
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1
